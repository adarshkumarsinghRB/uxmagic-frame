
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music App Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link id="heading-font-link" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
    <link id="body-font-link" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        heading: ['var(--font-heading-name)', 'sans-serif'],
                        body: ['var(--font-body-name)', 'sans-serif'],
                    },
                    spacing: {
                        base: 'var(--space-base)',
                    },
                    borderRadius: {
                        small: 'var(--radius-small)',
                        large: 'var(--radius-large)',
                        full: '9999px',
                    },
                    boxShadow: {
                        custom: 'var(--shadow-custom)',
                        'custom-hover': 'var(--shadow-custom-hover)',
                    },
                    colors: {
                        // Custom mapping for this specific dark theme clone
                        spotify: {
                            green: '#1ED760',
                            black: '#121212',
                            dark: '#191414',
                            light: '#FFFFFF',
                            grey: '#B3B3B3'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            /* Typography */
            --font-heading-name: 'Montserrat';
            --font-body-name: 'Inter';
            --font-heading: 'Montserrat', sans-serif;
            --font-body: 'Inter', sans-serif;
            --letter-spacing-heading: -0.5px;
            --letter-spacing-body: 0px;
            
            /* Spacing */
            --space-base: 1rem;
            
            /* Borders */
            --radius-small: 4px;
            --radius-large: 8px;
            --border-width: 1px;
            
            /* Shadows */
            --shadow-color: 0 0 0;
            --shadow-offset-x: 0px;
            --shadow-offset-y: 4px;
            --shadow-blur: 10px;
            --shadow-spread: 0px;
            --shadow-opacity: 0.3;
            --shadow-custom: 0px 4px 10px rgba(0, 0, 0, 0.3);
            --shadow-custom-hover: 0px 6px 15px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body class="font-body bg-neutral-900 text-neutral-50 h-screen overflow-hidden" style="height: auto; min-height: 100%;">

    <!-- Main Container -->
    <main class="flex flex-col h-screen w-full max-w-md mx-auto relative px-8 pb-12 pt-20">
        
        <!-- Background Gradient Effect (Subtle) -->
        <div class="absolute top-0 left-0 w-full h-1/2 bg-gradient-to-b from-neutral-800/20 to-transparent pointer-events-none"></div>

        <!-- Content Area: Logo & Text -->
        <div class="flex-1 flex flex-col justify-center items-center text-center z-10 mb-12">
            <!-- Logo -->
            <div class="w-16 h-16 mb-8 bg-neutral-50 rounded-full flex items-center justify-center p-1">
                <img src="https://upload.wikimedia.org/wikipedia/commons/1/19/Spotify_logo_without_text.svg" alt="Spotify Logo" class="w-full h-full object-contain">
            </div>

            <!-- Heading -->
            <h1 class="font-heading text-4xl font-bold leading-tight tracking-tight text-neutral-50 mb-4">
                Millions of songs.<br>
                Free on Spotify.
            </h1>
        </div>

        <!-- Action Buttons Area -->
        <div class="w-full space-y-4 z-10">
            <!-- Sign up free button -->
            <button class="w-full py-4 px-8 bg-[#1ED760] hover:bg-[#1db954] active:scale-[0.98] transition-all duration-200 rounded-full flex items-center justify-center group">
                <span class="font-heading font-bold text-neutral-900 text-base tracking-wide">Sign up for free</span>
            </button>

            <!-- Log in button -->
            <button class="w-full py-4 px-8 bg-transparent border border-neutral-400 hover:border-neutral-50 active:scale-[0.98] transition-all duration-200 rounded-full flex items-center justify-center">
                <span class="font-heading font-bold text-neutral-50 text-base tracking-wide">Log in</span>
            </button>
        </div>

    </main>

</body>
</html>
